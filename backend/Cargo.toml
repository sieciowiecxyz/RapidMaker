[package]
name = "rapidmaker-checkout-demo"
version = "0.1.0"
edition = "2024"
publish = false

[workspace]
members = ["geometry"]

[dependencies]
axum = "0.8"
serde = { version = "1", features = ["derive"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "sync", "process", "time"] }

serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
uuid = { version = "1", features = ["v4"] }
rapidfab-3d-web-preview-generator = { path = "geometry" }
gltf = { version = "1.4", default-features = false, features = ["utils"] }
