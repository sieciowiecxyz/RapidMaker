[package]
name = "rapidmaker-geometry"
version.workspace = true
edition.workspace = true
license = "MIT"
publish.workspace = true

[dependencies]
tracing.workspace = true
quick-xml = "0.42"
lib3mf = { version = "0.1.7", default-features = false }
cxx = "1"
meshopt = "=0.6.2"
zip = { version = "9", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[build-dependencies]
cxx-build = "1"

[dev-dependencies]
serde_json = "1"
gltf = { version = "1.4.1", default-features = false, features = ["utils"] }
