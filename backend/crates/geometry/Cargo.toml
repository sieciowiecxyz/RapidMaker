[package]
name = "rapidmaker-geometry"
version.workspace = true
edition.workspace = true
license = "MIT"
publish.workspace = true

[dependencies]
tracing.workspace = true
gltf = { version = "1.4.1", features = ["import"] }
lib3mf = { version = "0.1.7", default-features = false }
ply-rs-bw = "4.0.0"
cxx = "1"
tobj = { version = "4.0.3", default-features = false }
serde_json = "1"
flate2 = "1"

[build-dependencies]
cxx-build = "1"
