[package]
name = "rapidmaker-notifications"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
tokio.workspace = true
serde.workspace = true
lettre = { version = "0.11.23", default-features = false, features = ["builder", "smtp-transport", "tokio1-rustls-tls"] }
async-imap = { version = "0.12", default-features = false, features = ["runtime-tokio"] }
futures-util = "0.3"
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
webpki-roots = "1"
mail-parser = { version = "0.11", default-features = false }
hmac = "0.12"
sha2 = "0.10"
