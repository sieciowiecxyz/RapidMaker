[package]
name = "rapidmaker-auth"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
hmac = "0.12"
sha2 = "0.10"
subtle = "2"
getrandom = "0.3"
webauthn-rs = { version = "=0.5.5", default-features = false, features = ["danger-allow-state-serialisation"] }
argon2 = { version = "0.6", default-features = false, features = ["alloc", "password-hash", "zeroize"] }
totp-rs = { version = "6", default-features = false, features = ["std", "otpauth", "zeroize"] }
chacha20poly1305 = { version = "0.11", default-features = false, features = ["alloc", "zeroize"] }
