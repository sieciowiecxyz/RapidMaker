[package]
name = "rapidmaker-api"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
tracing.workspace = true
tower-http = { version = "0.6.11", default-features = false, features = ["timeout"] }
axum.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["fs", "io-util"] }
futures-util = "0.3"
libc = "0.2"
reqwest.workspace = true
uuid.workspace = true
gltf.workspace = true
rapidmaker-geometry.workspace = true
rapidmaker-packing.workspace = true
rapidmaker-pricing.workspace = true
rapidmaker-slicer.workspace = true
rapidmaker-storage.workspace = true
rapidmaker-notifications.workspace = true
rapidmaker-auth.workspace = true
rapidmaker-payments.workspace = true
rapidmaker-shipping.workspace = true
sha2 = "0.10"
percent-encoding = "2"

utoipa.workspace = true
utoipa-axum.workspace = true
utoipa-swagger-ui = { version = "10", default-features = false, features = ["axum", "vendored"] }
prometheus-client = { version = "0.25.1", default-features = false }

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "postgres"] }
tracing-subscriber.workspace = true
tower = { version = "0.5", features = ["util"] }
